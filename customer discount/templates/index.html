<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll Calculator</title>
</head>
<body>
    <h1>Employee Wage Calculator</h1>
    <p>Welcome to the employee wage calculator.</p>

    <form action="/calculate" method="POST">
        
        <label for="name">Employee Name: </label>
        <input type="text" id="name" name="name" required>

        <label for="gender">Gender:</label>
        <select name="gender" id="gender" required>
            <option value="">Select Gender</option>
            <option value="male">Male</option>
            <option value="female">Female</option>
            <option value="other">Other</option>
        </select>

        <br><br>

        <label for="employee_type">Employee Type:</label>
        <select name="employee_type" id="employee_type">
            <option value="part_time">Part-Time</option>
            <option value="full_time">Full-Time</option>
        </select>

        <br><br>

        <label for="hours_worked">Hours Worked:</label>
        <input type="number" id="hours_worked"
            name="hours_worked" min="0" step="0.01" required>

        <br><br>

        <label for="hourly_rate">Hourly Rate (R)</label>
        <input type="number" id="hourly_rate"
            name="hourly_rate" min="0" step="0.01" required>

        <br><br>

        <button type="submit">Calculate Wages</button>
    </form>
</body>
</html>
